<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Angelo Bitraj · Graduate Software Engineer</title>
  <meta name="description" content="Angelo Bitraj, Graduate Software Engineer. GitHub, LinkedIn, email and WhatsApp in one place.">
  <link rel="canonical" href="https://anxhelo-bitraj.github.io/">
  <meta name="theme-color" content="#ffffff">

  <!-- Link previews (WhatsApp, LinkedIn, iMessage, Slack) -->
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Angelo Bitraj">
  <meta property="og:description" content="Graduate Software Engineer">
  <meta property="og:url" content="https://anxhelo-bitraj.github.io/">
  <meta property="og:image" content="https://anxhelo-bitraj.github.io/photo.jpg">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="photo.jpg">
  <link rel="apple-touch-icon" href="photo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --page: #f6f4f1;
      --card-mid: #e2ded8;
      --card: #d7cebf;
      --btn: #e7e0d3;
      --btn-hover: #ede7dd;
      --ink: #1f1e1c;
      --ink-2: #34322e;
      --muted: #7d766b;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 48px 16px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      max-width: 416px;
      min-height: 860px;
      margin: 0 auto;
      padding: 0 14px 28px;
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(180deg, #fff 0, #fff 190px, var(--card-mid) 310px, var(--card) 400px, var(--card) 100%);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .04), 0 10px 40px rgba(60, 50, 30, .07);
    }

    /* Photo that fades into the card */
    .hero {
      position: relative;
      height: 318px;
      margin: 0 -14px;
    }
    .hero img {
      position: absolute;
      top: 6px;
      left: 50%;
      width: 330px;
      height: 330px;
      object-fit: cover;
      transform: translateX(-50%);
      -webkit-mask-image:
        linear-gradient(to bottom, #000 58%, transparent 97%),
        linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to bottom, #000 58%, transparent 97%),
        linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
      mask-composite: intersect;
    }

    h1 {
      position: relative;
      margin: 0;
      font-size: 40px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -.01em;
      text-align: center;
    }
    .tagline {
      margin: 8px 0 36px;
      font-size: 17px;
      font-weight: 500;
      color: var(--ink-2);
      text-align: center;
    }

    /* Link buttons */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .link { position: relative; }
    .link > a {
      display: flex;
      align-items: center;
      min-height: 64px;
      padding: 8px 56px 8px 8px;
      border-radius: 999px;
      background: var(--btn);
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 1px 2px rgba(60, 50, 30, .06);
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .link > a:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(60, 50, 30, .10);
    }
    .link > a:active { transform: scale(.99); }
    .link img {
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }
    .link .text {
      flex: 1;
      text-align: center;
    }
    .label {
      display: block;
      font-size: 16px;
      font-weight: 500;
    }
    .sub {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 2px;
      font-size: 13px;
      color: var(--muted);
    }
    .more {
      position: absolute;
      top: 50%;
      right: 12px;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #4a4741;
      cursor: pointer;
      transform: translateY(-50%);
      transition: background .15s;
    }
    .more:hover { background: rgba(0, 0, 0, .06); }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    footer {
      margin-top: auto;
      padding-top: 64px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #1f1e1c;
      color: #fff;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity .2s, transform .2s;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Phones: the card becomes the whole screen, like the Linktree app */
    @media (max-width: 480px) {
      body { padding: 0; background: var(--card); }
      .card {
        min-height: 100vh;
        min-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- ================= EDIT YOUR DETAILS HERE ================= -->
    <div class="hero">
      <img src="photo.jpg" alt="Photo of Angelo Bitraj" width="600" height="600">
    </div>

    <h1>Angelo Bitraj</h1>
    <p class="tagline">Graduate Software Engineer</p>

    <ul class="links">
      <li class="link">
        <a href="https://github.com/anxhelo-bitraj" target="_blank" rel="noopener noreferrer">
          <img src="icons/github.svg" alt="" width="48" height="48">
          <span class="text"><span class="label">GitHub</span></span>
        </a>
        <button class="more" type="button" data-share aria-label="Share GitHub link">
          <svg width="4" height="16" viewBox="0 0 4 16" fill="currentColor" aria-hidden="true"><circle cx="2" cy="2" r="1.6"/><circle cx="2" cy="8" r="1.6"/><circle cx="2" cy="14" r="1.6"/></svg>
        </button>
      </li>

      <li class="link">
        <a href="https://www.linkedin.com/in/angelo-bitraj" target="_blank" rel="noopener noreferrer">
          <img src="icons/linkedin.webp" alt="" width="48" height="48">
          <span class="text"><span class="label">LinkedIn</span></span>
        </a>
        <button class="more" type="button" data-share aria-label="Share LinkedIn link">
          <svg width="4" height="16" viewBox="0 0 4 16" fill="currentColor" aria-hidden="true"><circle cx="2" cy="2" r="1.6"/><circle cx="2" cy="8" r="1.6"/><circle cx="2" cy="14" r="1.6"/></svg>
        </button>
      </li>

      <li class="link">
        <a href="mailto:angelobitraj@outlook.com">
          <img src="icons/outlook.webp" alt="" width="48" height="48">
          <span class="text">
            <span class="label">Email</span>
            <span class="sub">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></svg>
              Email · angelobitraj@outlook.com
            </span>
          </span>
        </a>
        <button class="more" type="button" data-share aria-label="Share email address">
          <svg width="4" height="16" viewBox="0 0 4 16" fill="currentColor" aria-hidden="true"><circle cx="2" cy="2" r="1.6"/><circle cx="2" cy="8" r="1.6"/><circle cx="2" cy="14" r="1.6"/></svg>
        </button>
      </li>

      <li class="link">
        <!-- wa.me needs the number with country code, digits only: +44 7447 705513 -> 447447705513 -->
        <a href="https://wa.me/447447705513" target="_blank" rel="noopener noreferrer">
          <img src="icons/whatsapp.webp" alt="" width="48" height="48">
          <span class="text"><span class="label">WhatsApp</span></span>
        </a>
        <button class="more" type="button" data-share aria-label="Share WhatsApp link">
          <svg width="4" height="16" viewBox="0 0 4 16" fill="currentColor" aria-hidden="true"><circle cx="2" cy="2" r="1.6"/><circle cx="2" cy="8" r="1.6"/><circle cx="2" cy="14" r="1.6"/></svg>
        </button>
      </li>

      <li class="link">
        <a href="contact.vcf" type="text/vcard">
          <img src="photo.jpg" alt="" width="48" height="48">
          <span class="text">
            <span class="label">Save contact</span>
            <span class="sub">Add me to your phone's contacts</span>
          </span>
        </a>
        <button class="more" type="button" data-share aria-label="Share contact card">
          <svg width="4" height="16" viewBox="0 0 4 16" fill="currentColor" aria-hidden="true"><circle cx="2" cy="2" r="1.6"/><circle cx="2" cy="8" r="1.6"/><circle cx="2" cy="14" r="1.6"/></svg>
        </button>
      </li>
    </ul>
    <!-- ================= END OF YOUR DETAILS ================= -->

    <footer>© Angelo Bitraj</footer>
  </main>

  <div class="toast" role="status" aria-live="polite"></div>

  <script>
    const toast = document.querySelector('.toast');
    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // Use the phone's native share sheet when there is one, otherwise copy to the clipboard.
    async function share(title, value, isUrl) {
      const data = isUrl ? { title, url: value } : { title, text: value };
      if (navigator.share) {
        try { await navigator.share(data); } catch (_) { /* share sheet closed */ }
        return;
      }
      try {
        await navigator.clipboard.writeText(value);
        showToast(isUrl ? 'Link copied' : 'Copied');
      } catch (_) {
        window.prompt('Copy this:', value);
      }
    }

    document.querySelectorAll('[data-share]').forEach((button) => {
      button.addEventListener('click', () => {
        const link = button.closest('.link').querySelector('a');
        const title = link.querySelector('.label').textContent;
        if (link.protocol === 'mailto:') {
          share(title, link.href.slice('mailto:'.length), false);
        } else {
          share(title, link.href, true);
        }
      });
    });
  </script>
</body>
</html>
