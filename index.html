       Delete this line if you ever want people to find it by searching your name. -->

  <!-- Colours the browser bars (Safari's status bar and toolbar) to match the page -->

  <!-- Link previews (WhatsApp, LinkedIn, iMessage, Slack) -->

  <meta property="og:title" content="Angelo Bitraj">
  <meta property="og:description" content="Graduate Software Engineer">
  <meta property="og:url" content="https://anxhelo-bitraj.github.io/">

  <link rel="icon" href="photo.jpg">
  <link rel="apple-touch-icon" href="photo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ---------- Colours and sizes (sizes change per screen in the media queries at the bottom) ---------- */
    :root {
      --bg-top: #f2ece3;
      --bg-mid: #e7dfd2;
      --bg-bottom: #d8cebe;
      --ink: #1d1d1f;
      --ink-2: #34322e;
      --muted: #6e6a63;
      --glass: linear-gradient(180deg, rgba(255, 255, 255, .62), rgba(255, 255, 255, .30));
      --glass-hover: linear-gradient(180deg, rgba(255, 255, 255, .80), rgba(255, 255, 255, .44));
      --glass-edge: rgba(255, 255, 255, .75);
      --spring: cubic-bezier(.34, 1.56, .64, 1);
      --ui-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

      --top-gap: 28px;   /* space above the photo */
      --photo: 330px;    /* photo width and height */
      --name: 40px;
      --tagline: 17px;
      --row: 64px;       /* link button height */
      --icon: 48px;
      --label: 16px;
      --sub: 12.5px;
      --gap: 12px;       /* space between link buttons */
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg-mid); /* shows when you over-scroll on a phone */
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Background: one continuous warm gradient with soft light, fixed behind everything ---------- */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(80vmax 60vmax at 50% -10%, #fbf8f3 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bottom) 100%);
    }
    .backdrop span {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      will-change: transform;
      animation: drift 22s ease-in-out infinite alternate;
    }
    .backdrop span:nth-child(1) { width: 55vmax; height: 55vmax; left: -20vmax; top: 35%; background: #f8f0e4; opacity: .85; }
    .backdrop span:nth-child(2) { width: 50vmax; height: 50vmax; right: -22vmax; top: 55%; background: #c4ae8f; opacity: .40; animation-duration: 26s; animation-delay: -8s; }
    .backdrop span:nth-child(3) { width: 40vmax; height: 40vmax; left: 20%; bottom: -22vmax; background: #f3e9dc; opacity: .80; animation-duration: 30s; animation-delay: -14s; }
    .backdrop span:nth-child(4) { width: 34vmax; height: 34vmax; right: -8vmax; top: -6vmax; background: #dfe4e8; opacity: .55; animation-duration: 34s; animation-delay: -4s; }
    @keyframes drift {
      to { transform: translate3d(6vmax, -5vmax, 0) scale(1.12); }
    }

    /* ---------- Page layout (phones first) ---------- */
    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(100%, 460px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        var(--top-gap)
        max(16px, env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    /* Round glass button in the top-right corner */
    .corner {
      position: absolute;
      top: max(14px, calc(env(safe-area-inset-top, 0px) + 6px));
      right: max(14px, env(safe-area-inset-right));
      z-index: 2;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 50%;
      background: rgba(255, 255, 255, .5);
      -webkit-backdrop-filter: blur(16px) saturate(170%);
      backdrop-filter: blur(16px) saturate(170%);
      color: var(--ink);
      box-shadow: inset 0 1px 0 #fff, 0 4px 14px rgba(40, 30, 15, .12);
      transition: transform .45s var(--spring), background .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .corner:active {
      transform: scale(.92);
      transition-duration: .1s;
    }

    /* ---------- Photo, name, title ---------- */
    .profile { text-align: center; }

    .hero {
      position: relative;
      height: calc(var(--photo) * .96);
    }
    /* Soft studio light behind the head */
    .hero::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 44%;
      width: calc(var(--photo) * 1.3);
      height: calc(var(--photo) * 1.15);
      background: radial-gradient(closest-side, rgba(255, 255, 255, .8), rgba(255, 255, 255, 0));
      transform: translate(-50%, -50%);
    }
    .hero img {
      position: absolute;
      top: 0;
      left: 50%;
      width: var(--photo);
      height: var(--photo);
      object-fit: contain;
      transform: translateX(-50%);
      /* oval fade around the face, so the shoulders and shirt dissolve into the background */
      -webkit-mask-image: radial-gradient(ellipse 56% 62% at 50% 40%, #000 58%, transparent 100%);
      mask-image: radial-gradient(ellipse 56% 62% at 50% 40%, #000 58%, transparent 100%);
    }

    h1 {
      margin: 0;
      font-size: var(--name);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -.01em;
    }
    .tagline {
      margin: 8px 0 32px;
      font-size: var(--tagline);
      font-weight: 500;
      color: var(--ink-2);
    }

    /* ---------- Link buttons: frosted glass capsules ---------- */
    .links {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .link {
      position: relative;
      animation: rise .7s cubic-bezier(.2, .8, .2, 1) backwards;
      animation-delay: calc(var(--i, 0) * 70ms + 150ms);
    }
    .link:nth-child(2) { --i: 1; }
    .link:nth-child(3) { --i: 2; }
    .link:nth-child(4) { --i: 3; }
    .link:nth-child(5) { --i: 4; }
    .link:nth-child(6) { --i: 5; }
    .link:nth-child(7) { --i: 6; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(.98); }
    }

    .link > a:not(.action) {
      position: relative;
      display: flex;
      align-items: center;
      min-height: var(--row);
      padding: 8px calc(var(--icon) + 8px) 8px 8px;
      border: 1px solid var(--glass-edge);
      border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      backdrop-filter: blur(20px) saturate(170%);
      color: var(--ink);
      font-family: var(--ui-font);
      text-decoration: none;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .95),
        inset 0 -1px 0 rgba(255, 255, 255, .25),
        0 1px 2px rgba(60, 45, 25, .06),
        0 10px 28px -12px rgba(60, 45, 25, .26);
      transition: transform .5s var(--spring), box-shadow .3s ease, background .3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    /* Specular highlight that follows the pointer */
    .link > a:not(.action)::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(180px circle at var(--mx, 50%) var(--my, -60%), rgba(255, 255, 255, .7), transparent 60%);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }
    .link > a:not(.action):active {
      transform: scale(.97);
      transition-duration: .12s;
    }

    .link img {
      flex: none;
      width: var(--icon);
      height: var(--icon);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .85), 0 3px 8px rgba(40, 30, 15, .16);
    }
    .link .text {
      flex: 1;
      text-align: center;
    }
    .label {
      display: block;
      font-size: var(--label);
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .sub {
      display: block;
      margin-top: 2px;
      font-size: var(--sub);
      color: var(--muted);
    }

    /* Small glass button on the right of a row: share, copy or download */
    .action {
      position: absolute;
      top: 50%;
      right: 12px;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 50%;
      background: rgba(255, 255, 255, .45);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: var(--ink);
      box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(40, 30, 15, .10);
      cursor: pointer;
      transform: translateY(-50%);
      transition: transform .45s var(--spring), background .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .action:active {
      transform: translateY(-50%) scale(.9);
      transition-duration: .1s;
    }
    .action svg { display: block; }

    /* Hover effects only for a mouse or trackpad, so they don't get stuck after a tap on touch screens */
    @media (hover: hover) and (pointer: fine) {
      .link > a:not(.action):hover {
        background: var(--glass-hover);
        transform: translateY(-2px);
        box-shadow:
          inset 0 1px 0 #fff,
          inset 0 -1px 0 rgba(255, 255, 255, .3),
          0 2px 4px rgba(60, 45, 25, .06),
          0 18px 36px -14px rgba(60, 45, 25, .32);
      }
      .link > a:not(.action):hover::after { opacity: 1; }
      .action:hover {
        background: rgba(255, 255, 255, .85);
        transform: translateY(-50%) scale(1.08);
      }
      .corner:hover {
        background: rgba(255, 255, 255, .9);
        transform: scale(1.06);
      }
    }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    footer {
      margin-top: auto;
      padding-top: 48px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    /* iOS-style HUD for "Copied" feedback */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px 11px 14px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      background: rgba(28, 28, 30, .72);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      color: #fff;
      font-family: var(--ui-font);
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px) scale(.96);
      transition: opacity .25s ease, transform .45s var(--spring);
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    /* ================= Screen sizes ================= */

    /* Phones (portrait): keep the photo clear of the notch / Dynamic Island.
       env(safe-area-inset-top) is the status bar height when the page draws behind it (0 otherwise). */
    @media (max-width: 599px) {
      :root {
        --top-gap: max(40px, calc(env(safe-area-inset-top, 0px) + 12px));
        --photo: min(330px, 90vw);
      }
    }

    /* iPad portrait and other tall screens: everything a step bigger, still one column */
    @media (min-width: 600px) and (min-height: 900px) {
      :root {
        --top-gap: clamp(48px, 7vh, 96px);
        --photo: 400px;
        --name: 50px;
        --tagline: 19px;
        --row: 70px;
        --icon: 52px;
        --label: 17px;
        --sub: 13.5px;
        --gap: 14px;
      }
      .page { width: min(100%, 560px); }
      .profile { margin-top: auto; } /* with footer's margin-top: auto this centres the content vertically */
      .corner {
        top: max(20px, calc(env(safe-area-inset-top, 0px) + 10px));
        right: max(20px, env(safe-area-inset-right));
      }
      footer { padding-bottom: 8px; }
    }

    /* iPad landscape, laptops and desktops (and phones held sideways): photo on the left, links on the right */
    @media (min-width: 1024px) and (orientation: landscape),
           (min-width: 600px) and (max-height: 520px) and (orientation: landscape) {
      :root {
        --photo: clamp(170px, min(32vw, 52vh), 440px);
        --name: clamp(30px, 3.4vw, 58px);
        --tagline: clamp(15px, 1.35vw, 21px);
        --row: clamp(52px, 7.5vh, 72px);
        --icon: clamp(38px, 5.4vh, 52px);
        --label: clamp(15px, 1.15vw, 18px);
        --sub: clamp(12px, .9vw, 14px);
        --gap: clamp(8px, 1.5vh, 14px);
      }
      .page {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: 1fr auto;
        align-items: center;
        column-gap: clamp(24px, 6vw, 120px);
        width: min(100%, 1240px);
        padding:
          max(clamp(20px, 6vh, 80px), env(safe-area-inset-top))
          max(clamp(20px, 5vw, 80px), env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom))
          max(clamp(20px, 5vw, 80px), env(safe-area-inset-left));
      }
      .profile { margin-top: 0; }
      .tagline { margin-bottom: 0; }
      .links {
        justify-self: center;
        width: 100%;
        max-width: 480px;
      }
      footer {
        grid-column: 1 / -1;
        padding-top: clamp(12px, 3vh, 32px);
      }
      .corner {
        position: fixed;
        top: max(clamp(14px, 2.6vh, 28px), env(safe-area-inset-top));
        right: max(clamp(14px, 2vw, 28px), env(safe-area-inset-right));
      }
    }

    /* Phones held sideways: keep the links clear of the Save contact button (and the notch) on the right */
    @media (min-width: 600px) and (max-height: 520px) and (orientation: landscape) {
      .page { padding-right: calc(max(clamp(14px, 2vw, 28px), env(safe-area-inset-right)) + 56px); }
    }

    /* Big desktop monitors: everything a step larger */
    @media (min-width: 1800px) and (min-height: 1000px) and (orientation: landscape) {
      :root {
        --photo: clamp(440px, 27vw, 600px);
        --name: clamp(58px, 3vw, 72px);
        --tagline: clamp(21px, 1.1vw, 26px);
        --row: 78px;
        --icon: 58px;
        --label: 19px;
        --sub: 15px;
        --gap: 16px;
      }
      .page { width: min(100%, 1480px); }
      .links { max-width: 580px; }
      .action { width: 42px; height: 42px; right: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

  <div class="toast" role="status" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>

  <script>
    const toast = document.querySelector('.toast');
    const toastText = toast.querySelector('span');
    const isTouch = matchMedia('(pointer: coarse)').matches;
    let toastTimer;

    function showToast(message) {
      toastText.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // Older or locked-down browsers block the Clipboard API; a hidden textarea still works there.
    function legacyCopy(text) {
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(area);
      area.select();
      const copied = document.execCommand('copy');
      area.remove();
      return copied;
    }

    async function copy(text, message) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(message);
      } catch (_) {
        if (legacyCopy(text)) showToast(message);
        else window.prompt('Copy this:', text);
      }
    }

    // Phones get the native share sheet; computers get the link copied, which is what people expect there.
    async function share(title, url) {
      if (isTouch && navigator.share) {
        try { await navigator.share({ title, url }); } catch (_) { /* share sheet closed */ }
        return;
      }
      copy(url, 'Link copied');
    }

    document.querySelectorAll('[data-action]').forEach((button) => {
      button.addEventListener('click', () => {
        const link = button.closest('.link').querySelector('a');
        if (button.dataset.action === 'copy') {
          copy(button.dataset.copy, button.dataset.done || 'Copied');
        } else {
          share(link.querySelector('.label').textContent, link.href);
        }
      });
    });

    // Move the glass highlight with the pointer
    document.querySelectorAll('.link > a:not(.action)').forEach((link) => {
      link.addEventListener('pointermove', (event) => {
        const box = link.getBoundingClientRect();
        link.style.setProperty('--mx', `${event.clientX - box.left}px`);
        link.style.setProperty('--my', `${event.clientY - box.top}px`);
      });
    });
  </script>
</body>
</html>
