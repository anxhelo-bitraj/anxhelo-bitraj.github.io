<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Security: the browser may only load scripts, styles and images from this site itself. Inline code, plugins,
       other sites, forms and <base> tricks are all refused, so injected code can't run. Keep this first in <head>. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <!-- Privacy: sites you link to (LinkedIn, GitHub, WhatsApp) aren't told the visitor came from here -->
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Angelo Bitraj · Graduate Software Engineer</title>
  <meta name="description" content="Angelo Bitraj, Graduate Software Engineer. CV, GitHub, LinkedIn, email and WhatsApp in one place.">
  <!-- Keeps the page out of Google and other search results: it is reachable through the link / QR code only.
       Delete this line if you ever want people to find it by searching your name. -->
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://anxhelo-bitraj.github.io/">
  <!-- Colours the browser bars (Safari's status bar and toolbar) to match the page -->
  <meta name="theme-color" content="#f2ece3">

  <!-- Link previews (WhatsApp, LinkedIn, iMessage, Slack) -->
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Angelo Bitraj">
  <meta property="og:description" content="Graduate Software Engineer">
  <meta property="og:url" content="https://anxhelo-bitraj.github.io/">
  <meta property="og:image" content="https://anxhelo-bitraj.github.io/photo.jpg">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="photo.jpg">
  <link rel="apple-touch-icon" href="photo.jpg">
  <link rel="preload" as="image" href="photo-cutout.webp">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <main class="page">
    <a class="corner" href="contact.vcf" type="text/vcard" aria-label="Save contact" title="Save contact">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="10" cy="8" r="4"/><path d="M2.5 20.5c.8-3.6 3.9-6 7.5-6 1.4 0 2.7.4 3.8 1"/><path d="M19 14v7M15.5 17.5h7"/>
      </svg>
    </a>

    <!-- ================= EDIT YOUR DETAILS HERE ================= -->
    <header class="profile">
      <div class="hero">
        <!-- photo-cutout.webp is photo.jpg with the background removed: run ./tools/update-photo.sh after changing photo.jpg -->
        <img src="photo-cutout.webp" alt="Photo of Angelo Bitraj" width="600" height="600">
      </div>
      <h1>Angelo Bitraj</h1>
      <p class="tagline">Graduate Software Engineer</p>
    </header>

    <!--
      The small button on the right of each row does one thing, chosen with data-action:
        data-action="share"    phone: opens the share sheet for the link; computer: copies the link
        data-action="copy"     copies the text in data-copy (e.g. email address or phone number)
        a plain <a download>   downloads the file
    -->
    <ul class="links">
      <li class="link">
        <a href="https://github.com/anxhelo-bitraj" target="_blank" rel="noopener noreferrer">
          <img src="icons/github.svg" alt="" width="48" height="48">
          <span class="text"><span class="label">GitHub</span></span>
        </a>
        <button class="action" type="button" data-action="share" aria-label="Share GitHub link" title="Share">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M8 11H6.5A1.5 1.5 0 0 0 5 12.5v7A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H16"/></svg>
        </button>
      </li>

      <li class="link">
        <a href="https://www.linkedin.com/in/angelo-bitraj" target="_blank" rel="noopener noreferrer">
          <img src="icons/linkedin.webp" alt="" width="48" height="48">
          <span class="text"><span class="label">LinkedIn</span></span>
        </a>
        <button class="action" type="button" data-action="share" aria-label="Share LinkedIn link" title="Share">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M8 11H6.5A1.5 1.5 0 0 0 5 12.5v7A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H16"/></svg>
        </button>
      </li>

      <li class="link">
        <a href="Angelo_Bitraj_CV.pdf" target="_blank" rel="noopener">
          <img src="icons/cv.svg" alt="" width="48" height="48">
          <span class="text">
            <span class="label">CV</span>
            <span class="sub">View or download · PDF</span>
          </span>
        </a>
        <a class="action" href="Angelo_Bitraj_CV.pdf" download="Angelo_Bitraj_CV.pdf" aria-label="Download CV" title="Download">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M5 20h14"/></svg>
        </a>
      </li>

      <li class="link">
        <a href="mailto:angelobitraj@outlook.com">
          <img src="icons/outlook.webp" alt="" width="48" height="48">
          <span class="text">
            <span class="label">Email</span>
            <span class="sub">angelobitraj@outlook.com</span>
          </span>
        </a>
        <button class="action" type="button" data-action="copy" data-copy="angelobitraj@outlook.com" data-done="Email copied" aria-label="Copy email address" title="Copy">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6A2.5 2.5 0 0 0 13 3.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></svg>
        </button>
      </li>

      <li class="link">
        <!-- wa.me needs the number with country code, digits only: +44 7447 705513 -> 447447705513 -->
        <a href="https://wa.me/447447705513" target="_blank" rel="noopener noreferrer">
          <img src="icons/whatsapp.webp" alt="" width="48" height="48">
          <span class="text">
            <span class="label">WhatsApp</span>
            <span class="sub">+44 7447 705513</span>
          </span>
        </a>
        <button class="action" type="button" data-action="copy" data-copy="+44 7447 705513" data-done="Number copied" aria-label="Copy phone number" title="Copy">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6A2.5 2.5 0 0 0 13 3.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></svg>
        </button>
      </li>
    </ul>
    <!-- ================= END OF YOUR DETAILS ================= -->

    <footer>© Angelo Bitraj</footer>
  </main>

  <div class="toast" role="status" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
    <span></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
