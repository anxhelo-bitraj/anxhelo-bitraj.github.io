<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Angelo Bitraj · Graduate Software Engineer</title>
  <meta name="description" content="Angelo Bitraj, Graduate Software Engineer. CV, GitHub, LinkedIn, email and WhatsApp in one place.">
  <link rel="canonical" href="https://anxhelo-bitraj.github.io/">
  <meta name="theme-color" content="#ffffff">

  <!-- Link previews (WhatsApp, LinkedIn, iMessage, Slack) -->
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Angelo Bitraj">
  <meta property="og:description" content="Graduate Software Engineer">
  <meta property="og:url" content="https://anxhelo-bitraj.github.io/">
  <meta property="og:image" content="https://anxhelo-bitraj.github.io/photo.jpg">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="photo.jpg">
  <link rel="apple-touch-icon" href="photo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --page: #f6f4f1;
      --card-mid: #e2ded8;
      --card: #d7cebf;
      --ink: #1d1d1f;
      --ink-2: #34322e;
      --muted: #6e6a63;
      --glass: linear-gradient(180deg, rgba(255, 255, 255, .62), rgba(255, 255, 255, .30));
      --glass-hover: linear-gradient(180deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .42));
      --glass-edge: rgba(255, 255, 255, .75);
      --spring: cubic-bezier(.34, 1.56, .64, 1);
      --ui-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 48px 16px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      max-width: 416px;
      min-height: 860px;
      margin: 0 auto;
      padding: 0 14px 28px;
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(180deg, #fff 0, #fff 190px, var(--card-mid) 310px, var(--card) 400px, var(--card) 100%);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .04), 0 10px 40px rgba(60, 50, 30, .07);
    }
    .card > :not(.ambient) {
      position: relative;
      z-index: 1;
    }

    /* Soft drifting light behind the buttons, so the frosted glass has something to blur */
    .ambient {
      position: absolute;
      inset: 330px 0 0;
      z-index: 0;
      pointer-events: none;
    }
    .ambient span {
      position: absolute;
      border-radius: 50%;
      filter: blur(42px);
      will-change: transform;
      animation: drift 20s ease-in-out infinite alternate;
    }
    .ambient span:nth-child(1) { width: 240px; height: 240px; left: -70px; top: 40px; background: #fbf3e8; opacity: .9; }
    .ambient span:nth-child(2) { width: 260px; height: 260px; right: -90px; top: 200px; background: #bda789; opacity: .55; animation-duration: 24s; animation-delay: -8s; }
    .ambient span:nth-child(3) { width: 220px; height: 220px; left: 60px; top: 420px; background: #f6ece0; opacity: .8; animation-duration: 28s; animation-delay: -14s; }
    .ambient span:nth-child(4) { width: 160px; height: 160px; right: 10px; top: 20px; background: #cfd6dc; opacity: .45; animation-duration: 30s; animation-delay: -4s; }
    @keyframes drift {
      to { transform: translate3d(46px, -36px, 0) scale(1.12); }
    }

    /* Photo that fades into the card */
    .hero {
      height: 318px;
      margin: 0 -14px;
    }
    .hero img {
      position: absolute;
      top: 6px;
      left: 50%;
      width: 330px;
      height: 330px;
      object-fit: cover;
      transform: translateX(-50%);
      -webkit-mask-image:
        linear-gradient(to bottom, #000 58%, transparent 97%),
        linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to bottom, #000 58%, transparent 97%),
        linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
      mask-composite: intersect;
    }

    h1 {
      margin: 0;
      font-size: 40px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -.01em;
      text-align: center;
    }
    .tagline {
      margin: 8px 0 32px;
      font-size: 17px;
      font-weight: 500;
      color: var(--ink-2);
      text-align: center;
    }

    /* Link buttons: frosted glass capsules */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .link {
      position: relative;
      animation: rise .7s cubic-bezier(.2, .8, .2, 1) backwards;
      animation-delay: calc(var(--i, 0) * 70ms + 150ms);
    }
    .link:nth-child(2) { --i: 1; }
    .link:nth-child(3) { --i: 2; }
    .link:nth-child(4) { --i: 3; }
    .link:nth-child(5) { --i: 4; }
    .link:nth-child(6) { --i: 5; }
    .link:nth-child(7) { --i: 6; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(.98); }
    }

    .link > a:not(.action) {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 64px;
      padding: 8px 56px 8px 8px;
      border: 1px solid var(--glass-edge);
      border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      backdrop-filter: blur(20px) saturate(170%);
      color: var(--ink);
      font-family: var(--ui-font);
      text-decoration: none;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .95),
        inset 0 -1px 0 rgba(255, 255, 255, .25),
        0 1px 2px rgba(60, 45, 25, .06),
        0 10px 28px -12px rgba(60, 45, 25, .28);
      transition: transform .5s var(--spring), box-shadow .3s ease, background .3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    /* Specular highlight that follows the pointer */
    .link > a:not(.action)::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(180px circle at var(--mx, 50%) var(--my, -60%), rgba(255, 255, 255, .7), transparent 60%);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }
    .link > a:not(.action):hover {
      background: var(--glass-hover);
      transform: translateY(-2px);
      box-shadow:
        inset 0 1px 0 #fff,
        inset 0 -1px 0 rgba(255, 255, 255, .3),
        0 2px 4px rgba(60, 45, 25, .06),
        0 18px 36px -14px rgba(60, 45, 25, .35);
    }
    .link > a:not(.action):hover::after { opacity: 1; }
    .link > a:not(.action):active {
      transform: scale(.97);
      transition-duration: .12s;
    }

    .link img {
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .85), 0 3px 8px rgba(40, 30, 15, .16);
    }
    .link .text {
      flex: 1;
      text-align: center;
    }
    .label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .sub {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 2px;
      font-size: 12.5px;
      color: var(--muted);
    }

    /* Small glass button on the right of a row: share, copy or download */
    .action {
      position: absolute;
      top: 50%;
      right: 12px;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 50%;
      background: rgba(255, 255, 255, .45);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: var(--ink);
      box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(40, 30, 15, .10);
      cursor: pointer;
      transform: translateY(-50%);
      transition: transform .45s var(--spring), background .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .action:hover {
      background: rgba(255, 255, 255, .85);
      transform: translateY(-50%) scale(1.08);
    }
    .action:active {
      transform: translateY(-50%) scale(.9);
      transition-duration: .1s;
    }
    .action svg { display: block; }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    footer {
      margin-top: auto;
      padding-top: 56px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    /* iOS-style HUD for "Copied" feedback */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px 11px 14px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      background: rgba(28, 28, 30, .72);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      color: #fff;
      font-family: var(--ui-font);
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px) scale(.96);
      transition: opacity .25s ease, transform .45s var(--spring);
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    /* Phones: the card becomes the whole screen */
    @media (max-width: 480px) {
      body { padding: 0; background: var(--card); }
      .card {
        min-height: 100vh;
        min-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">

    <ul class="links">

  <div class="toast" role="status" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
    <span></span>
  </div>

  <script>
    const toast = document.querySelector('.toast');
    const toastText = toast.querySelector('span');
    const isTouch = matchMedia('(pointer: coarse)').matches;
    let toastTimer;

    function showToast(message) {
      toastText.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // Older or locked-down browsers block the Clipboard API; a hidden textarea still works there.
    function legacyCopy(text) {
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(area);
      area.select();
      const copied = document.execCommand('copy');
      area.remove();
      return copied;
    }

    async function copy(text, message) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(message);
      } catch (_) {
        if (legacyCopy(text)) showToast(message);
        else window.prompt('Copy this:', text);
      }
    }

    // Phones get the native share sheet; computers get the link copied, which is what people expect there.
    async function share(title, url) {
      if (isTouch && navigator.share) {
        try { await navigator.share({ title, url }); } catch (_) { /* share sheet closed */ }
        return;
      }
      copy(url, 'Link copied');
    }

    document.querySelectorAll('[data-action]').forEach((button) => {
      button.addEventListener('click', () => {
        const link = button.closest('.link').querySelector('a');
        if (button.dataset.action === 'copy') {
          copy(button.dataset.copy, button.dataset.done || 'Copied');
        } else {
          share(link.querySelector('.label').textContent, link.href);
        }
      });
    });

    // Move the glass highlight with the pointer
    document.querySelectorAll('.link > a:not(.action)').forEach((link) => {
      link.addEventListener('pointermove', (event) => {
        const box = link.getBoundingClientRect();
        link.style.setProperty('--mx', `${event.clientX - box.left}px`);
        link.style.setProperty('--my', `${event.clientY - box.top}px`);
      });
    });
  </script>
